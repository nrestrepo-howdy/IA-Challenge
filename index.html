<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verbo</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; background: #0b0e14; }
      #stage { display: block; width: 100vw; height: 100vh; }
      #say {
        position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%);
        width: min(520px, calc(100vw - 48px));
        padding: 13px 18px; border-radius: 999px;
        border: 1px solid #263040; background: rgba(12,16,23,.82);
        backdrop-filter: blur(12px);
        font: 400 15px/1 ui-sans-serif, system-ui, sans-serif; color: #dde4ec;
        outline: none; transition: border-color .18s, box-shadow .18s;
      }
      #say::placeholder { color: #5b6675; }
      #say:focus { border-color: #3d5a74; box-shadow: 0 0 0 4px rgba(61,90,116,.16); }
      #say:disabled { opacity: .5; }
      #log {
        position: fixed; left: 50%; bottom: 108px; transform: translateX(-50%);
        width: min(520px, calc(100vw - 48px));
        display: flex; flex-direction: column-reverse; gap: 5px;
        font: 400 12px/1.45 ui-monospace, "SF Mono", Menlo, monospace;
        pointer-events: none;
      }
      #log .l { color: #6f7c8c; }
      #log .you   { color: #dde4ec; font-size: 13px; }
      #log .accept { color: #6fd3a8; }
      #log .reject { color: #d98878; }
      #verify {
        position: fixed; right: 24px; top: 24px; width: min(400px, calc(100vw - 48px));
        display: none; flex-direction: column; gap: 1px;
        padding: 12px 14px; border-radius: 10px;
        border: 1px solid #1e2733; background: rgba(10,14,20,.78);
        backdrop-filter: blur(14px);
        font: 400 11px/1 ui-monospace, "SF Mono", Menlo, monospace;
      }
      #verify[data-open="true"] { display: flex; }
      .vp-head {
        color: #8e9caa; padding-bottom: 9px; margin-bottom: 5px;
        border-bottom: 1px solid #1c2531; letter-spacing: .01em;
      }
      .vp-lane {
        display: grid; grid-template-columns: 68px repeat(4, 26px) 1fr;
        align-items: center; gap: 4px; padding: 5px 0;
      }
      .vp-name { color: #7d8b9a; }
      .vp-cell {
        text-align: center; padding: 3px 0; border-radius: 3px;
        border: 1px solid #212b38; color: #3f4b59; font-size: 9.5px; letter-spacing: .04em;
      }
      .vp-cell[data-state="passed"]   { border-color: #1f5c46; color: #58c497; }
      .vp-cell[data-state="failed"]   { border-color: #6b3128; color: #e08774; }
      .vp-cell[data-state="skipped"]  { border-color: #1a222c; color: #2c3542; }
      .vp-cell[data-state="advisory"] { border-color: #2c4256; color: #6d8ba6; }
      .vp-note {
        padding-left: 8px; color: #6a7787; font-size: 10px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .vp-lane[data-outcome="accepted"] .vp-note { color: #6fd3a8; }
      #suggest {
        position: fixed; left: 50%; bottom: 108px; transform: translateX(-50%);
        width: min(520px, calc(100vw - 48px));
        display: none; flex-wrap: wrap; gap: 6px;
      }
      #suggest[data-open="true"] { display: flex; }
      .sg {
        padding: 5px 11px; border-radius: 999px;
        border: 1px solid #212b38; background: rgba(12,16,23,.6);
        font: 400 11px/1 ui-monospace, "SF Mono", Menlo, monospace;
        color: #6a7787; cursor: pointer;
        transition: border-color .18s, color .18s;
      }
      .sg:hover { border-color: #3d5a74; color: #9aa7b6; }
      #inventory {
        position: fixed; left: 24px; top: 24px; width: min(220px, calc(100vw - 48px));
        display: none; flex-direction: column; gap: 1px;
        padding: 10px 12px; border-radius: 10px;
        border: 1px solid #1e2733; background: rgba(10,14,20,.78);
        backdrop-filter: blur(14px);
        font: 400 11px/1 ui-monospace, "SF Mono", Menlo, monospace;
      }
      #inventory[data-open="true"] { display: flex; }
      .inv-head {
        display: flex; justify-content: space-between; align-items: center; gap: 10px;
        color: #8e9caa; padding-bottom: 8px; margin-bottom: 4px;
        border-bottom: 1px solid #1c2531; letter-spacing: .01em;
      }
      .inv-undo {
        padding: 0; border: 0; background: none; cursor: pointer;
        font: inherit; color: #6a7787; letter-spacing: .04em;
      }
      .inv-undo:hover { color: #9aa7b6; }
      .inv-row {
        display: grid; grid-template-columns: 1fr 14px; align-items: center; gap: 6px;
        padding: 4px 0;
      }
      .inv-verb {
        color: #6f7c8c; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .inv-drop {
        padding: 0; border: 0; background: none; cursor: pointer;
        font: inherit; line-height: 1; color: #3f4b59;
      }
      .inv-row:hover .inv-verb { color: #dde4ec; }
      .inv-drop:hover { color: #d98878; }
      #status {
        position: fixed; left: 16px; bottom: 14px;
        font: 500 11px/1 ui-monospace, "SF Mono", Menlo, monospace;
        letter-spacing: .11em; text-transform: uppercase;
        color: #6b7684; cursor: pointer;
      }
      #status:hover { color: #9aa7b6; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="verify"></div>
    <div id="inventory"></div>
    <div id="log"></div>
    <div id="suggest" data-open="true"></div>
    <input id="say" autocomplete="off" spellcheck="false"
           placeholder="tell the world what to become — try &ldquo;make it rain&rdquo;" />
    <div id="status" title="copy a link to this world">starting</div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
