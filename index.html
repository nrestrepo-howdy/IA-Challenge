<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verbo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <style>
      /*
        One visual system for the chrome.

        The world is the product; everything below is a thin layer over it. Two
        decisions carry most of the weight:

          - Language is set in a sans face, data is set in mono. A log line is a
            sentence and reads as one; a layer cell is a reading off an instrument
            and reads as one. Nothing is mono merely because it is small.
          - Legibility over a moving scene comes from surfaces and scrims, never from
            brighter text. Raising contrast on the type would make the chrome shout
            over the thing it sits on; darkening the few hundred pixels behind it
            does not.

        The palette is taken from the scene itself: moonlight for what passed, the
        dawn band for what failed, the night sky's violet for what only advises.
      */
      :root {
        color-scheme: dark;

        --bg: #0a0d13;
        --surface: rgba(13, 17, 24, 0.62);
        --surface-lift: rgba(20, 26, 36, 0.5);
        --hair: rgba(176, 194, 219, 0.14);
        --hair-soft: rgba(176, 194, 219, 0.07);

        --fg: #e9eef6;
        --fg-2: #a5b1c3;
        --fg-3: #6e7a8b;
        --fg-4: #4a5464;

        /* Scene colours, borrowed. Nothing here is invented. */
        --moon: #cfe0f2;
        --ember: #e7a68d;
        --advise: #9dabcb;

        --sans: "Instrument Sans", ui-sans-serif, system-ui, -apple-system,
          "Segoe UI", Helvetica, Arial, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

        --ease: cubic-bezier(0.2, 0.7, 0.25, 1);
        --quick: 140ms;
        --calm: 260ms;
        --slow: 460ms;

        --gap: 26px;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; background: var(--bg); }
      body {
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      #stage { display: block; width: 100vw; height: 100vh; }

      /*
        The scrims. The log and the input sit directly on the world, and at noon the
        world underneath them is white. These two gradients are the only thing between
        the two, and they are gradients rather than panels so the horizon still shows
        through the top of them.
      */
      .scrim {
        position: fixed; left: 0; right: 0; pointer-events: none; z-index: 0;
      }
      .scrim.top {
        top: 0; height: 230px;
        background: linear-gradient(to bottom, rgba(5, 7, 11, 0.5), rgba(5, 7, 11, 0.22) 46%, transparent);
      }
      .scrim.bottom {
        bottom: 0; height: 340px;
        background: linear-gradient(to top, rgba(5, 7, 11, 0.84), rgba(5, 7, 11, 0.56) 32%, rgba(5, 7, 11, 0.18) 66%, transparent);
      }

      .panel {
        border: 1px solid var(--hair);
        border-radius: 14px;
        background: var(--surface);
        backdrop-filter: blur(22px) saturate(115%);
        -webkit-backdrop-filter: blur(22px) saturate(115%);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.045) inset, 0 18px 44px -28px rgba(0, 0, 0, 0.9);
      }

      .micro {
        font: 500 10px/1 var(--mono);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--fg-3);
      }

      /* ─── the prompt ────────────────────────────────────────────────────── */

      #say-dock {
        position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
        width: min(620px, calc(100vw - 2 * var(--gap)));
        z-index: 4;
        animation: rise var(--slow) var(--ease) both;
      }
      #say {
        display: block; width: 100%;
        padding: 15px 52px 15px 22px;
        border-radius: 16px;
        border: 1px solid rgba(176, 194, 219, 0.18);
        background: rgba(11, 15, 21, 0.66);
        backdrop-filter: blur(22px) saturate(115%);
        -webkit-backdrop-filter: blur(22px) saturate(115%);
        font: 400 16px/1.2 var(--sans);
        letter-spacing: -0.005em;
        color: var(--fg);
        outline: none;
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.05) inset, 0 20px 50px -30px rgba(0, 0, 0, 0.95);
        transition: border-color var(--calm) var(--ease), box-shadow var(--calm) var(--ease),
          background-color var(--calm) var(--ease);
      }
      #say::placeholder { color: var(--fg-3); }
      #say:hover { border-color: rgba(176, 194, 219, 0.26); }
      #say:focus {
        border-color: rgba(207, 224, 242, 0.42);
        background: rgba(13, 18, 25, 0.76);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.06) inset,
          0 0 0 4px rgba(207, 224, 242, 0.08),
          0 20px 50px -30px rgba(0, 0, 0, 0.95);
      }
      /* Disabled means a cycle is running, so the prompt says so rather than
         dimming out: a greyed field reads as broken, a working one reads as busy. */
      #say:disabled { color: var(--fg-2); cursor: progress; }
      #say-dock::after {
        content: "";
        position: absolute; left: 14px; right: 14px; bottom: 0; height: 1px;
        border-radius: 1px;
        background: linear-gradient(90deg, transparent, var(--moon), transparent);
        opacity: 0; transform: scaleX(0.3);
        transition: opacity var(--calm) var(--ease);
      }
      #say-dock:has(#say:disabled)::after {
        opacity: 0.55;
        animation: sweep 1.15s var(--ease) infinite;
      }
      .say-key {
        position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
        pointer-events: none;
        font: 400 13px/1 var(--mono);
        color: var(--fg-4);
        border: 1px solid var(--hair-soft); border-radius: 6px;
        padding: 5px 8px 6px;
        transition: color var(--calm) var(--ease), border-color var(--calm) var(--ease);
      }
      #say-dock:has(#say:focus) .say-key { color: var(--fg-2); border-color: var(--hair); }

      /* ─── the transcript ────────────────────────────────────────────────── */

      #log {
        position: fixed; left: 50%; bottom: 116px; transform: translateX(-50%);
        width: min(620px, calc(100vw - 2 * var(--gap)));
        display: flex; flex-direction: column-reverse; gap: 2px;
        pointer-events: none; z-index: 3;
      }
      #log .l {
        font: 400 13.5px/1.5 var(--sans);
        letter-spacing: -0.004em;
        color: var(--fg-2);
        padding: 3px 0 3px 18px;
        position: relative;
        text-shadow: 0 1px 10px rgba(5, 7, 11, 0.55);
        animation: land var(--calm) var(--ease) both;
        transition: opacity var(--slow) var(--ease), transform var(--slow) var(--ease),
          margin-top var(--slow) var(--ease);
      }
      /* A line is a sentence with a mark beside it, not a row in a table. */
      #log .l::before {
        content: ""; position: absolute; left: 4px; top: 10px;
        width: 4px; height: 4px; border-radius: 50%;
        background: currentColor; opacity: 0.55;
      }
      #log .you {
        color: var(--fg); font-size: 15px; font-weight: 500;
        padding-top: 8px;
      }
      #log .you::before {
        content: "›"; top: 7px; left: 2px; width: auto; height: auto;
        background: none; color: var(--fg-3);
        font: 400 15px/1 var(--sans);
      }
      #log .accept { color: var(--moon); }
      #log .accept::before { background: var(--moon); box-shadow: 0 0 8px rgba(207, 224, 242, 0.5); }
      #log .reject { color: var(--ember); }
      #log .reject::before { background: var(--ember); }
      /* Old lines leave. The transcript is what is happening, not a record. */
      #log .l.gone { opacity: 0; transform: translateY(6px); margin-top: -1.6em; }

      /* ─── first run ─────────────────────────────────────────────────────── */

      #suggest {
        position: fixed; left: 50%; bottom: 116px; transform: translateX(-50%);
        width: min(620px, calc(100vw - 2 * var(--gap)));
        display: none; flex-direction: column; align-items: flex-start; gap: 14px;
        z-index: 3;
      }
      #suggest[data-open="true"] { display: flex; }
      .sg-lead {
        margin: 0; max-width: 30ch;
        font: 400 19px/1.4 var(--sans);
        letter-spacing: -0.015em;
        color: var(--fg);
        text-shadow: 0 1px 14px rgba(5, 7, 11, 0.7);
        animation: rise 620ms var(--ease) both;
      }
      .sg-lead b { font-weight: 400; color: var(--fg-3); display: block; font-size: 14px; margin-top: 6px; }
      .sg-row { display: flex; flex-wrap: wrap; gap: 8px; }
      .sg {
        padding: 8px 14px; border-radius: 999px;
        border: 1px solid var(--hair); background: var(--surface);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        font: 400 13px/1 var(--sans);
        color: var(--fg-2); cursor: pointer;
        animation: rise 620ms var(--ease) both;
        transition: border-color var(--quick) var(--ease), color var(--quick) var(--ease),
          background-color var(--quick) var(--ease), transform var(--quick) var(--ease);
      }
      .sg:nth-child(1) { animation-delay: 90ms; }
      .sg:nth-child(2) { animation-delay: 160ms; }
      .sg:nth-child(3) { animation-delay: 230ms; }
      .sg:hover {
        border-color: rgba(207, 224, 242, 0.36); color: var(--fg);
        background: var(--surface-lift); transform: translateY(-1px);
      }
      .sg:active { transform: translateY(0); }

      /* ─── verification ──────────────────────────────────────────────────── */

      #verify {
        position: fixed; right: var(--gap); top: var(--gap);
        width: min(444px, calc(100vw - 2 * var(--gap)));
        display: none; flex-direction: column;
        padding: 15px 16px 13px; z-index: 5;
      }
      #verify[data-open="true"] { display: flex; animation: panel-in var(--calm) var(--ease) both; }

      .vp-top {
        display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
        padding-bottom: 11px;
      }
      .vp-title {
        font: 500 15px/1.25 var(--sans); letter-spacing: -0.012em; color: var(--fg);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .vp-state { flex: none; font: 500 10px/1 var(--mono); letter-spacing: 0.14em;
        text-transform: uppercase; color: var(--fg-3); }
      .vp-state[data-state="running"] { color: var(--fg-3); animation: pulse 1.5s var(--ease) infinite; }
      .vp-state[data-state="accepted"] { color: var(--moon); }
      .vp-state[data-state="rejected"] { color: var(--ember); }

      /*
        The column legend. Without it the four cells are a table of equals, and the
        one thing this project insists on -- that L3 has an opinion and no vote --
        is invisible.
      */
      .vp-cols {
        display: grid; grid-template-columns: 78px repeat(4, 30px) 1fr;
        align-items: end; gap: 4px;
        padding-bottom: 7px; border-bottom: 1px solid var(--hair-soft);
      }
      .vp-cols-decide, .vp-cols-advise {
        font: 500 9px/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase;
        text-align: center; padding-bottom: 5px;
      }
      .vp-cols-decide {
        grid-column: 2 / 5; color: var(--fg-3);
        border-bottom: 1px solid var(--hair); padding-bottom: 4px;
      }
      .vp-cols-advise {
        grid-column: 5 / 6; color: var(--advise);
        border-bottom: 1px dashed rgba(157, 171, 203, 0.34); padding-bottom: 4px;
        margin-left: 8px;
      }

      .vp-lane {
        display: grid; grid-template-columns: 78px repeat(4, 30px) 1fr;
        align-items: center; gap: 4px;
        padding: 7px 8px 7px 0; margin: 0 -8px 0 0;
        border-radius: 8px;
        position: relative;
        animation: lane-in var(--calm) var(--ease) both;
        transition: background-color var(--calm) var(--ease), opacity var(--calm) var(--ease);
      }
      .vp-name {
        font: 400 12.5px/1 var(--sans); color: var(--fg-3);
        padding-left: 9px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        transition: color var(--calm) var(--ease);
      }
      /* The winner is a lit row, not a row with a green word in it. */
      .vp-lane[data-outcome="accepted"] {
        background: linear-gradient(90deg, rgba(207, 224, 242, 0.09), rgba(207, 224, 242, 0.02));
      }
      .vp-lane[data-outcome="accepted"]::before {
        content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 2px;
        border-radius: 2px; background: var(--moon);
        box-shadow: 0 0 10px rgba(207, 224, 242, 0.45);
        animation: grow var(--calm) var(--ease) both;
      }
      .vp-lane[data-outcome="accepted"] .vp-name { color: var(--fg); }
      .vp-lane[data-outcome="rejected"] { opacity: 0.72; }
      .vp-lane[data-outcome="unreached"] { opacity: 0.42; }

      .vp-cell {
        text-align: center; padding: 4px 0; border-radius: 4px;
        border: 1px solid var(--hair-soft); color: var(--fg-4);
        font: 500 10px/1 var(--mono); letter-spacing: 0.05em;
        transition: color var(--calm) var(--ease), border-color var(--calm) var(--ease),
          background-color var(--calm) var(--ease);
      }
      .vp-cell[data-layer="L3"] { margin-left: 8px; border-style: dashed; }
      .vp-cell[data-state="passed"] {
        border-color: rgba(207, 224, 242, 0.3); color: var(--moon);
        background: rgba(207, 224, 242, 0.07);
      }
      .vp-cell[data-state="failed"] {
        border-color: rgba(231, 166, 141, 0.42); color: var(--ember);
        background: rgba(231, 166, 141, 0.1);
      }
      .vp-cell[data-state="skipped"] { border-color: transparent; color: var(--fg-4); opacity: 0.45; }
      .vp-cell[data-state="advisory"] {
        border-color: rgba(157, 171, 203, 0.4); color: var(--advise);
        background: rgba(157, 171, 203, 0.06);
      }

      .vp-note {
        padding-left: 10px; color: var(--fg-3);
        font: 400 11.5px/1.3 var(--sans);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .vp-lane[data-outcome="accepted"] .vp-note { color: var(--moon); }
      .vp-lane[data-outcome="rejected"] .vp-note { color: var(--fg-2); }

      .vp-foot {
        margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--hair-soft);
        font: 400 11px/1.45 var(--sans); color: var(--fg-3);
      }
      .vp-foot em { font-style: normal; color: var(--advise); }
      .vp-empty {
        padding: 12px 2px 4px;
        font: 400 12.5px/1.5 var(--sans); color: var(--fg-2);
      }

      /* ─── inventory ─────────────────────────────────────────────────────── */

      #inventory {
        position: fixed; left: var(--gap); top: var(--gap);
        width: min(264px, calc(100vw - 2 * var(--gap)));
        display: none; flex-direction: column;
        padding: 13px 12px 9px; z-index: 5;
      }
      #inventory[data-open="true"] { display: flex; animation: panel-in var(--calm) var(--ease) both; }

      .inv-head {
        display: flex; justify-content: space-between; align-items: center; gap: 10px;
        padding: 0 4px 9px; margin-bottom: 4px;
        border-bottom: 1px solid var(--hair-soft);
        font: 500 10px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase;
        color: var(--fg-3); white-space: nowrap;
      }
      .inv-undo {
        flex: none; padding: 4px 8px; border-radius: 6px;
        border: 1px solid var(--hair-soft); background: transparent; cursor: pointer;
        font: 500 9.5px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase;
        color: var(--fg-3);
        transition: color var(--quick) var(--ease), border-color var(--quick) var(--ease),
          background-color var(--quick) var(--ease);
      }
      .inv-undo:hover { color: var(--fg); border-color: var(--hair); background: var(--surface-lift); }

      .inv-row {
        display: grid; grid-template-columns: 1fr 18px; align-items: center; gap: 8px;
        padding: 6px 4px; border-radius: 7px;
        transition: background-color var(--quick) var(--ease);
      }
      .inv-row[data-new="true"] { animation: land var(--calm) var(--ease) both; }
      .inv-row:hover { background: var(--surface-lift); }
      .inv-verb {
        font: 400 13px/1.25 var(--sans); color: var(--fg-2);
        letter-spacing: -0.005em;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        transition: color var(--quick) var(--ease);
      }
      .inv-drop {
        padding: 0; border: 0; background: none; cursor: pointer;
        font: 400 15px/1 var(--sans); color: var(--fg-4);
        opacity: 0; transition: opacity var(--quick) var(--ease), color var(--quick) var(--ease);
      }
      .inv-row:hover .inv-verb { color: var(--fg); }
      .inv-row:hover .inv-drop { opacity: 1; }
      .inv-drop:focus-visible { opacity: 1; }
      .inv-drop:hover { color: var(--ember); }

      /* ─── status ────────────────────────────────────────────────────────── */

      #status {
        position: fixed; left: var(--gap); bottom: 22px; z-index: 4;
        display: inline-flex; align-items: center; gap: 7px;
        padding: 6px 11px 6px 9px; border-radius: 999px;
        border: 1px solid transparent;
        font: 500 10px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--fg-3); cursor: pointer;
        text-shadow: 0 1px 8px rgba(5, 7, 11, 0.6);
        transition: color var(--calm) var(--ease), border-color var(--calm) var(--ease),
          background-color var(--calm) var(--ease);
      }
      #status::before {
        content: ""; width: 5px; height: 5px; border-radius: 50%;
        background: currentColor; opacity: 0.7;
      }
      #status:hover {
        color: var(--fg); border-color: var(--hair-soft); background: var(--surface);
      }

      /* ─── motion ────────────────────────────────────────────────────────── */

      @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes land {
        from { opacity: 0; transform: translateY(-5px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes panel-in {
        from { opacity: 0; transform: translateY(-8px) scale(0.985); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes lane-in {
        from { opacity: 0; transform: translateX(8px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes grow {
        from { transform: scaleY(0); }
        to { transform: scaleY(1); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.42; }
      }
      @keyframes sweep {
        0% { transform: scaleX(0.2) translateX(-120%); }
        100% { transform: scaleX(0.2) translateX(120%); }
      }

      /* The prompt is bottom-anchored and centred, so #say-dock keeps its own
         translate; the rise animation would otherwise fight it. */
      #say-dock { animation-name: rise-centred; }
      @keyframes rise-centred {
        from { opacity: 0; transform: translateX(-50%) translateY(12px); }
        to { opacity: 1; transform: translateX(-50%) translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }

      @media (max-width: 720px) {
        :root { --gap: 16px; }
        #verify { width: calc(100vw - 2 * var(--gap)); }
        #inventory { width: calc(100vw - 2 * var(--gap)); }
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div class="scrim top"></div>
    <div class="scrim bottom"></div>
    <div id="verify" class="panel"></div>
    <div id="inventory" class="panel"></div>
    <div id="log"></div>
    <div id="suggest" data-open="true"></div>
    <div id="say-dock">
      <input id="say" autocomplete="off" spellcheck="false"
             placeholder="tell the world what to become" />
      <span class="say-key">⏎</span>
    </div>
    <div id="status" title="copy a link to this world">starting</div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
