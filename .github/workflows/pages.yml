name: build, verify, deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    # The same harness that gates the agent gates the deploy. A build that skipped it
    # would publish a world no oracle had judged, which is the one thing this project
    # is about not doing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      # Typecheck, the 465 unit tests, and the acceptance-criteria gate. Not the browser
      # suite, and the reason is worth writing down rather than leaving as an omission.
      #
      # A GitHub runner has no GPU. Its WebGPU is SwiftShader, which comes up and then
      # drops the device part-way through a run — twenty-four "Instance dropped in
      # popErrorScope" errors, after which every frame capture waits on a device that is
      # gone. Forcing the WebGL2 path instead does render, and takes 27.5 seconds to
      # reach first frame, so a suite written against a real renderer's timings sits on
      # the wrong side of every timeout.
      #
      # Either way what CI would be measuring is a software rasteriser, not the product.
      # The browser suite runs where there is a GPU — `npm run verify` locally, which is
      # what the contributing rules require before anything is reported finished — and
      # its results are what `.verbo/` records. Pretending otherwise by loosening the
      # timeouts until it passes would be the exact failure this project is about.
      - run: npm run verify:fast

  deploy:
    needs: verify
    # Pages needs a public repository on this plan: on a private one the API answers
    # "Your current plan does not support GitHub Pages for this repository", and a job
    # that cannot succeed should not be reported as a failure. Make the repository
    # public and this deploys on the next push, with no edit here.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run build
        env:
          # Derived from the repository, not written down. Pages serves a project site
          # under /<repo>/, and a hard-coded base is a white page the day the repository
          # is named anything else — which it is: this one is not called "verbo".
          VERBO_BASE: /${{ github.event.repository.name }}/
      # `enablement` turns Pages on if it is off, which saves the one manual setting
      # this workflow would otherwise depend on — and a deploy that needs a click
      # somewhere else is a deploy that breaks the first time nobody remembers it.
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
